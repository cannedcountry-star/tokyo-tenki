name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-*.png'
      - '.github/workflows/android.yml'

env:
  APP_ID: com.cannedcountry.tokyotenki
  APP_NAME: Tokyo Tenki

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1) 静的ファイルを www/ に組み立てる（リポジトリ側は変更しない）
      - name: Assemble web assets
        run: |
          mkdir -p build/www
          cp index.html build/www/app.html
          cp manifest.webmanifest sw.js icon-*.png build/www/
          # アプリ起動時は簡易表示（?mobile=1）で開く
          cat > build/www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>東京天気</title>
          <script>location.replace('./app.html?mobile=1')</script>
          EOF
          # Service Worker のプリキャッシュ対象に app.html を追加
          sed -i "s#'./index.html',#'./index.html', './app.html',#" build/www/sw.js
          # manifest の start_url を合わせる
          sed -i 's#"start_url": "./?mobile=1"#"start_url": "./app.html?mobile=1"#' build/www/manifest.webmanifest

      # 2) Capacitor プロジェクトを生成
      - name: Init Capacitor
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm i -D @capacitor/cli@6 >/dev/null
          npm i @capacitor/core@6 @capacitor/android@6 >/dev/null
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      # 3) APK をビルド
      - name: Build debug APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp build/android/app/build/outputs/apk/debug/app-debug.apk tokyo-tenki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tokyo-tenki-apk
          path: tokyo-tenki.apk
          retention-days: 30
